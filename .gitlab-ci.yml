include:
  - project: sysadmin/ci-utilities
    file:
      - /gitlab-templates/reuse-lint.yml
      - /gitlab-templates/blocks/workflow.yml

stages:
  - validate
  - test
  - test-upgrade

# Don't run linting when triggered from kde-linux CI
reuse:
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - when: always

.test-base:
  image: s3.kde.org/ci-vm-images/suse-openqa-worker
  # Their artifacts land in gitlab-artifacts/ owned by the job user.
  dependencies: []
  tags:
    - VM
    - amd64
  variables:
    OPENQA_HOST_ADDR: openqa.kde.org
    WORKER_FLOW: install
    WORKER_ARGS: ""
  rules:
    - if: $CI_MERGE_REQUEST_IID
      when: manual
    - when: always
  allow_failure: false
  before_script:
    - |
      if [ "${ENCRYPTION:-plain}" = encrypted ]; then
        WORKER_ARGS="${WORKER_ARGS:+$WORKER_ARGS }--var FDE_INSTALL=1 --flavor-suffix=-encrypted"
      fi
  script:
    - rm -rf "$CI_PROJECT_DIR/gitlab-artifacts"
    - mkdir -p "$CI_PROJECT_DIR/gitlab-artifacts"
    - chmod 0777 "$CI_PROJECT_DIR/gitlab-artifacts"
    - ./setup.sh ./qa worker "$WORKER_FLOW" $WORKER_ARGS

  artifacts:
    when: always
    reports:
      junit:
        - gitlab-artifacts/*-results.xml
    paths:
      - gitlab-artifacts/

test:
  extends: .test-base
  stage: test
  parallel:
    matrix:
      - WORKER_FLOW: [install, upgrade]
        ENCRYPTION: [plain, encrypted]
